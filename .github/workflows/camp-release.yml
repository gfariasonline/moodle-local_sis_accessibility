name: Publish release to CAMP

# Configure the integration without publishing the development branch.
# Publication requires a public source repository and a claimed CAMP listing.
# Push an immutable release tag only when a release is ready and authorised.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  camp:
    if: startsWith(github.ref, 'refs/tags/')
    uses: camp-registry/camp-workflows/.github/workflows/release.yml@435e1324807d73e3bf05ad1bbcb45303807be6b2 # v1
